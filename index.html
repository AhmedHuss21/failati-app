const KEY='vilati_local_v1';const fresh=()=>({schema:1,name:'مشروع فيلتي',budget:0,expenses:[],contracts:[],docs:[],purchases:[],stageProgress:{},events:[],checklists:{},costPlan:{},finance:{startDate:'',months:39,period:6,cash:0,monthlySaving:0,reserve:10,stageBudgets:{},stageModes:{},stageExtras:{}},receiptQuality:'balanced',created:new Date().toISOString(),modified:new Date().toISOString()});
let data=fresh(),page='home',dirty=false,autoStatus='';let draftFile=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v)||0;const money=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(num(n))+' ر.س';const datefmt=s=>{if(!s)return '—';const d=new Date(s+'T12:00:00');if(Number.isNaN(d.getTime()))return '—';const greg=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const hijri=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);return greg+' م / '+hijri+' هـ'};const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);const today=()=>new Date().toISOString().slice(0,10);const sum=a=>a.reduce((x,y)=>x+num(y),0);

/* V3.0: estimations are user-entered; no unverified local market prices are embedded. */
const COST_ITEMS={
'التصميم والتراخيص':[['التصميم والتراخيص','مقطوعية']],
'الحفر وتجهيز الموقع':[['الحفر وتجهيز الموقع','مقطوعية']],

'العظم والخرسانة':[['الهيكل الخرساني','م²']],

function costPlan(){let c=data.costPlan||{};return {mode:['quick','manual','detailed'].includes(c.mode)?c.mode:'quick',areaMode:c.areaMode==='manual'?'manual':'auto',floors:Math.max(1,Math.min(4,num(c.floors)||2)),hasAnnex:c.hasAnnex!==false,groundPct:c.groundPct??60,upperPct:c.upperPct??60,annexPct:c.annexPct??30,unitRate:Math.max(0,num(c.unitRate)),solarPrepCost:Math.max(0,num(c.solarPrepCost)),solarSystemCost:Math.max(0,num(c.solarSystemCost)),solarBatteryCost:Math.max(0,num(c.solarBatteryCost)),shares:c.shares||{},land:Math.max(0,num(c.land)||400),areas:c.areas||{},finish:c.finish||'متوسط',solar:c.solar||'prep',battery:!!c.battery,annual:Math.max(0,num(c.annual)),risk:Math.max(0,num(c.risk)),lines:c.lines||{},manual:c.manual||{},source:c.source||'',sourceDate:c.sourceDate||'',approved:num(c.approved),approvedAt:c.approvedAt||''}}
const CP_SHARES={'التصميم والتراخيص':3,'الحفر وتجهيز الموقع':3,'القواعد والأساسات':12,'العظم والخرسانة':23,'المباني والعزل':9,'الكهرباء':9,'السباكة':8,'التكييف':8,'اللياسة':5,'الأرضيات والسيراميك':7,'الدهانات':4,'الأبواب والنوافذ':5,'التشطيبات النهائية':2,'تنسيق السطح والحديقة':0,'أخرى':2};
function costBuiltAreas(c=costPlan()){let a=c.areas||{},land=c.land,auto=c.areaMode==='auto',ground=auto?land*num(c.groundPct)/100:num(a.ground),upper=auto?land*num(c.upperPct)/100:num(a.first),annex=c.hasAnnex?(auto?land*num(c.annexPct)/100:num(a.annex)):0,other=auto?0:num(a.other);return {ground,upper,annex,other,total:ground+upper*Math.max(0,c.floors-1)+annex+other}}
function costSolarAmount(c=costPlan()){return c.solar==='prep'?c.solarPrepCost:c.solar==='full'?c.solarSystemCost+(c.battery?c.solarBatteryCost:0):0}
function costQuickBase(c=costPlan()){return costBuiltAreas(c).total*c.unitRate}
function costShare(s,c=costPlan()){return Math.max(0,num(c.shares[s]??CP_SHARES[s]??0))}

function costStageBase(s){let c=costPlan();if(c.mode==='manual')return Math.max(0,num(c.manual[s]));if(c.mode==='quick'){let shares=costShareTotal(c);return (shares?costQuickBase(c)*costShare(s,c)/shares:0)+(s==='الكهرباء'?costSolarAmount(c):0)}return sum((COST_ITEMS[s]||[]).map((it,j)=>{if(s==='الكهرباء'&&((j===2&&c.solar!=='prep')||(j===3&&c.solar!=='full')||(j===4&&(c.solar!=='full'||!c.battery))))return 0;let x=costLine(s,j);return x.qty*x.rate}))}
function costStageAmount(s){let c=costPlan(),base=costStageBase(s);if(isGarden(s))return base;let years=Math.max(0,windowFor(s)[0]/12);return base*Math.pow(1+c.annual/100,years)}

function budgetPage(){let c=costPlan(),base=costTotal(),risk=base*c.risk/100,total=base+risk,spent=totals().spent,areas=costBuiltAreas(c),quick=c.mode==='quick',auto=c.areaMode==='auto';return `<div class="section" style="margin-top:0"><h2>حاسبة تكلفة بناء فيلتي</h2><span class="pill ok">V3.1 تجريبي</span></div><div class="notice">احسب مسطحات البناء تلقائيًا من مساحة الأرض وعدد الأدوار، أو أدخل مسطحات المخططات. <b>أسعار المتر ونسب توزيع المراحل ليست أسعارًا سوقية معتمدة</b>؛ أدخل سعرًا مرجعيًا موثقًا، ثم راجع التوزيع مع مهندس أو جدول كميات قبل اعتماد الميزانية.</div><div class="panel"><h3>1 · بيانات الفيلا والحاسبة</h3><div class="formgrid"><div class="field"><label>طريقة تقدير الميزانية</label><select id="cp-mode" onchange="costModeView()"><option value="quick" ${quick?'selected':''}>حاسبة سريعة من المسطحات وسعر المتر</option><option value="manual" ${c.mode==='manual'?'selected':''}>ميزانية المراحل يدويًا</option><option value="detailed" ${c.mode==='detailed'?'selected':''}>بنود وكميات تفصيلية (متقدم)</option></select></div><div class="field"><label>مساحة الأرض (م²)</label><input id="cp-land" type="number" min="0" value="${c.land}" oninput="costAreaPreview()"></div><div class="field"><label>عدد الأدوار الرئيسية</label><select id="cp-floors" onchange="costAreaPreview()">${[1,2,3,4].map(n=>`<option value="${n}" ${c.floors===n?'selected':''}>${n} ${n===1?'دور':'أدوار'}</option>`).join('')}</select></div><div class="field"><label>مستوى التشطيب</label><select id="cp-finish">${['اقتصادي','متوسط','مرتفع'].map(x=>`<option ${c.finish===x?'selected':''}>${x}</option>`).join('')}</select></div></div><label style="display:block;margin:12px 0"><input id="cp-annex" type="checkbox" ${c.hasAnnex?'checked':''} onchange="costAreaPreview()"> يوجد ملحق علوي</label><div class="field"><label>طريقة حساب مسطحات البناء</label><select id="cp-area-mode" onchange="costAreaView()"><option value="auto" ${auto?'selected':''}>محسوبة تلقائيًا من مساحة الأرض وعدد الأدوار</option><option value="manual" ${!auto?'selected':''}>مدخلة من المخططات</option></select></div><div id="cp-area-auto" style="display:${auto?'block':'none'}"><div class="formgrid">${[['groundPct','نسبة بناء الأرضي (%)'],['upperPct','نسبة بناء كل دور علوي (%)'],['annexPct','نسبة بناء الملحق (%)']].map(([k,n])=>`<div class="field"><label>${n}</label><input type="number" min="0" max="100" step="1" data-pct="${k}" value="${c[k]}" oninput="costAreaPreview()"></div>`).join('')}</div><p class="muted mini">هذه النسب قابلة للتعديل وليست اشتراطات بلدية مؤكدة. يعتمد الحساب النهائي على رخصة البناء والمخططات.</p></div><div id="cp-area-manual" style="display:${auto?'none':'block'}"><div class="formgrid">${[['ground','الأرضي'],['first','كل دور علوي (مبدئيًا)'],['annex','الملحق'],['other','مسطحات إضافية']].map(([k,n])=>`<div class="field"><label>${n} (م²)</label><input type="number" min="0" step="0.01" data-area="${k}" value="${num(c.areas[k])}" oninput="costAreaPreview()"></div>`).join('')}</div><p class="muted mini">إذا اختلفت مساحات الأدوار العلوية، أدخل مجموع الفروق ضمن «مسطحات إضافية» مؤقتًا أو استخدم التقدير التفصيلي.</p></div><div class="notice" id="cp-area-summary">إجمالي المسطحات: ${Math.round(areas.total*100)/100} م² (الأرضي ${Math.round(areas.ground)}، العلوي ${Math.round(areas.upper*Math.max(0,c.floors-1))}، الملحق ${Math.round(areas.annex)})</div><div class="cp-quick" style="display:${quick?'block':'none'}"><div class="formgrid"><div class="field"><label>سعر المتر المرجعي للتسليم بمستوى التشطيب المختار (ر.س/م²)</label><input id="cp-unit-rate" type="number" min="0" step="1" value="${c.unitRate}" placeholder="أدخل سعرًا موثقًا من عرض مقاول"></div><div class="field"><label>مصدر السعر</label><input id="cp-source" value="${esc(c.source)}" placeholder="اسم المقاول أو المرجع"></div><div class="field"><label>تاريخ السعر</label><input id="cp-date" type="date" value="${esc(c.sourceDate)}"></div></div><p class="muted mini">لا نملأ سعر المتر تلقائيًا دون مرجع قابل للتحقق. يجب توضيح هل يشمل السعر الضريبة والتراخيص والأعمال الخارجية.</p></div><h3>2 · الطاقة الشمسية</h3><div class="field"><label>تجهيزات الطاقة الشمسية</label><select id="cp-solar" onchange="costSolarView()"><option value="none" ${c.solar==='none'?'selected':''}>بدون تجهيزات</option><option value="prep" ${c.solar==='prep'?'selected':''}>تمديدات وتجهيزات مستقبلية فقط</option><option value="full" ${c.solar==='full'?'selected':''}>نظام شمسي كامل</option></select></div><div class="cp-quick" style="display:${quick?'block':'none'}"><div id="cp-solar-prep" style="display:${c.solar==='prep'?'block':'none'}" class="field"><label>تكلفة تجهيزات الطاقة الشمسية المستقبلية (ر.س)</label><input id="cp-solar-prep-cost" type="number" min="0" value="${c.solarPrepCost}" placeholder="أدخل عرض سعر"></div><div id="cp-solar-full" style="display:${c.solar==='full'?'block':'none'}" class="field"><label>تكلفة النظام الشمسي الكامل دون البطاريات (ر.س)</label><input id="cp-solar-system-cost" type="number" min="0" value="${c.solarSystemCost}" placeholder="حسب القدرة وعرض المورد"></div></div><div id="cp-battery-row" style="display:${c.solar==='full'?'block':'none'};margin-top:10px"><label><input type="checkbox" id="cp-battery" ${c.battery?'checked':''} onchange="costSolarView()"> إضافة بطاريات للنظام الكامل</label><div class="cp-quick field" id="cp-battery-cost-row" style="display:${quick&&c.battery?'block':'none'}"><label>تكلفة البطاريات (ر.س)</label><input id="cp-battery-cost" type="number" min="0" value="${c.solarBatteryCost}" placeholder="عرض سعر البطاريات"></div></div><p class="muted mini">تظهر الطاقة الشمسية كبند مستقل ضمن مرحلة الكهرباء، ولا تدخل مرتين في سعر المتر. تحقق من قدرة السطح الإنشائية والمساحة المتاحة مع حديقة السطح.</p><h3>3 · الاحتياطي والأسعار المستقبلية</h3><div class="formgrid"><div class="field"><label>احتياطي المخاطر (%)</label><input id="cp-risk" type="number" min="0" max="40" step="0.1" value="${c.risk}"></div><div class="field"><label>ارتفاع الأسعار السنوي للأعمال التقديرية (%)</label><input id="cp-annual" type="number" min="0" max="30" step="0.1" value="${c.annual}"></div></div><div class="actions"><button class="btn primary" onclick="saveCostPlan()">احسب واحفظ التقدير</button></div></div><div class="cards"><div class="card"><div class="lbl">تكلفة البناء قبل الاحتياطي</div><div class="val">${money(base)}</div></div><div class="card"><div class="lbl">احتياطي المخاطر</div><div class="val">${money(risk)}</div></div><div class="card"><div class="lbl">الإجمالي التقديري</div><div class="val">${money(total)}</div></div><div class="card"><div class="lbl">الميزانية المعتمدة</div><div class="val">${money(data.budget)}</div></div></div><div class="notice">المدفوع المسجل: ${money(spent)}. لا تُجمع المصروفات والعقود فوق الميزانية مرة ثانية. حديقة السطح منفصلة عن تكلفة الوصول للسكن.</div><div class="panel"><h3>4 · تكلفة المراحل — اضغط لفتح التفاصيل</h3>${quick?'<p class="muted mini">توزيع النسب أدناه افتراضي وقابل للتعديل، ولم يُعتمد بعد من دراسة أسعار أو جدول كميات. يجب معايرته قبل استخدامه لاتخاذ قرار مالي.</p>':''}${STAGES.map((s,i)=>{let amount=costStageAmount(s),actual=costStageActual(s),diff=amount-actual;return `<details class="cp-stage" ${s==='الكهرباء'?'open':''}><summary style="cursor:pointer;padding:14px 0"><b>${esc(s)}</b><span style="float:left">${money(amount)}</span><div class="muted mini">المدفوع: ${money(sum(data.expenses.filter(x=>x.stage===s).map(expensePaid))+sum(data.contracts.filter(x=>x.stage===s).map(paid)))} · الالتزامات المسجلة: ${money(actual)} · ${diff<0?'تجاوز تقديري '+money(-diff):'هامش تقديري '+money(diff)}</div></summary><div class="cp-detail"><div class="cp-manual" style="display:${c.mode==='manual'?'block':'none'}"><label>الميزانية اليدوية (ر.س)</label><input type="number" min="0" data-manual="${esc(s)}" value="${num(c.manual[s])}"></div><div class="cp-quick" style="display:${quick?'block':'none'}"><label>حصة المرحلة من التكلفة الأساسية (وزن نسبي قابل للتعديل)</label><input type="number" min="0" step="0.1" data-share="${esc(s)}" value="${costShare(s,c)}">${s==='الكهرباء'?`<p class="muted mini">الطاقة الشمسية المضافة: ${money(costSolarAmount(c))}، مستقلة عن حصة الكهرباء الأساسية.</p>`:''}</div><div class="cp-detailed" style="display:${c.mode==='detailed'?'block':'none'}">${(COST_ITEMS[s]||[]).map((it,j)=>`<div class="formgrid" style="padding:10px 0;border-bottom:1px solid #e5e7eb"><div class="field"><label>${esc(it[0])} · ${esc(it[1])}</label><input type="number" min="0" step="0.01" data-qty="${esc(s)}|${j}" value="${costLine(s,j).qty}"></div><div class="field"><label>سعر الوحدة (ر.س)</label><input type="number" min="0" step="0.01" data-rate="${esc(s)}|${j}" value="${costLine(s,j).rate}"></div></div>`).join('')}</div></div></details>`}).join('')}<div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveCostPlan()">حفظ وإعادة الحساب</button><button class="btn" onclick="approveCostPlan()">اعتماد الميزانية</button><button class="btn" onclick="applyCostToFinance()">نقل المراحل للخطة المالية</button></div><p class="muted mini">الاعتماد إجراء مستقل. نقل المراحل اختياري ولا يغير عقودك ومصاريفك. احتياطي الخطة المالية مستقل؛ راجعه لتجنب التكرار.</p></div>`}
function costModeView(){let mode=$('#cp-mode').value;document.querySelectorAll('.cp-manual').forEach(x=>x.style.display=mode==='manual'?'block':'none');document.querySelectorAll('.cp-quick').forEach(x=>x.style.display=mode==='quick'?'block':'none');document.querySelectorAll('.cp-detailed').forEach(x=>x.style.display=mode==='detailed'?'block':'none');costSolarView()}
function costAreaView(){let auto=$('#cp-area-mode').value==='auto';$('#cp-area-auto').style.display=auto?'block':'none';$('#cp-area-manual').style.display=auto?'none':'block';costAreaPreview()}
function costAreaPreview(){let land=Math.max(0,Number($('#cp-land').value)||0),floors=Number($('#cp-floors').value)||1,annex=$('#cp-annex').checked,auto=$('#cp-area-mode').value==='auto',pct=k=>Number(document.querySelector('[data-pct="'+k+'"]')?.value)||0,area=k=>Number(document.querySelector('[data-area="'+k+'"]')?.value)||0;let ground=auto?land*pct('groundPct')/100:area('ground'),upper=auto?land*pct('upperPct')/100:area('first'),roof=annex?(auto?land*pct('annexPct')/100:area('annex')):0,other=auto?0:area('other'),total=ground+upper*(floors-1)+roof+other;$('#cp-area-summary').textContent='إجمالي المسطحات: '+total.toLocaleString('ar-SA',{maximumFractionDigits:2})+' م² (الأرضي '+Math.round(ground)+'، العلوي '+Math.round(upper*(floors-1))+'، الملحق '+Math.round(roof)+')'}
function costSolarView(){let solar=$('#cp-solar').value,full=solar==='full',quick=$('#cp-mode').value==='quick';$('#cp-battery-row').style.display=full?'block':'none';$('#cp-solar-prep').style.display=quick&&solar==='prep'?'block':'none';$('#cp-solar-full').style.display=quick&&full?'block':'none';$('#cp-battery-cost-row').style.display=quick&&full&&$('#cp-battery').checked?'block':'none'}
function saveCostPlan(){let c=costPlan();c.mode=$('#cp-mode').value;c.areaMode=$('#cp-area-mode').value;c.land=Number($('#cp-land').value);c.floors=Number($('#cp-floors').value);c.hasAnnex=$('#cp-annex').checked;c.finish=$('#cp-finish').value;c.annual=Number($('#cp-annual').value);c.risk=Number($('#cp-risk').value);c.solar=$('#cp-solar').value;c.battery=$('#cp-battery').checked;c.unitRate=Number($('#cp-unit-rate').value);c.solarPrepCost=Number($('#cp-solar-prep-cost').value);c.solarSystemCost=Number($('#cp-solar-system-cost').value);c.solarBatteryCost=Number($('#cp-battery-cost').value);c.source=$('#cp-source').value.trim();c.sourceDate=$('#cp-date').value;c.areas={};for(let x of document.querySelectorAll('[data-area]'))c.areas[x.dataset.area]=Number(x.value);for(let x of document.querySelectorAll('[data-pct]'))c[x.dataset.pct]=Number(x.value);for(let x of document.querySelectorAll('[data-share]'))c.shares[x.dataset.share]=Number(x.value);for(let x of document.querySelectorAll('[data-manual]'))c.manual[x.dataset.manual]=Number(x.value);for(let x of document.querySelectorAll('[data-qty]')){let key=x.dataset.qty;c.lines[key]=c.lines[key]||{};c.lines[key].qty=Number(x.value)}for(let x of document.querySelectorAll('[data-rate]')){let key=x.dataset.rate;c.lines[key]=c.lines[key]||{};c.lines[key].rate=Number(x.value)}let vals=[c.land,c.annual,c.risk,c.unitRate,c.solarPrepCost,c.solarSystemCost,c.solarBatteryCost,...Object.values(c.areas),...Object.values(c.shares),...['groundPct','upperPct','annexPct'].map(k=>c[k]),...Object.values(c.manual),...Object.values(c.lines).flatMap(v=>[v.qty,v.rate])];if(vals.some(v=>!Number.isFinite(v)||v<0)||c.annual>30||c.risk>40||['groundPct','upperPct','annexPct'].some(k=>c[k]>100))return toast('راجع المساحات والأسعار والنسب؛ لا يُسمح بالقيم غير الصحيحة');if(c.mode==='quick'&&costShareTotal(c)<=0)return toast('أدخل أوزان المراحل أولًا');data.costPlan=c;mark();toast('تم حساب وحفظ التقدير')}
function approveCostPlan(){saveCostPlan();let v=costTotal()*(1+costPlan().risk/100);if(!v)return toast('أدخل تقديرات المراحل أولًا');if(!confirm('اعتماد الميزانية الجديدة بقيمة '+money(v)+'؟ ستُستبدل الميزانية المعتمدة في الإعدادات، دون تغيير المصاريف والعقود.'))return;data.budget=Math.round(v*100)/100;data.costPlan.approved=data.budget;data.costPlan.approvedAt=new Date().toISOString();mark();toast('تم اعتماد الميزانية')}
function applyCostToFinance(){saveCostPlan();let c=costPlan(),n=0;for(let s of STAGES){if(isGarden(s)||financeMode(s)!=='estimate')continue;data.finance.stageBudgets[s]=Math.round(costStageAmount(s)*100)/100;n++}mark();toast('نُقلت تقديرات '+n+' مرحلة إلى الخطة المالية. راجع احتياطي الخطة حتى لا يتكرر.')}

function initialize(){try{const v=localStorage.getItem(KEY);if(v){const d=JSON.parse(v);if(valid(d))data=normalizeData(d)}}catch(e){}render();window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}})}
function valid(d){return d&&d.schema===1&&Array.isArray(d.expenses)&&Array.isArray(d.contracts)&&Array.isArray(d.docs)&&typeof d.name==='string'&&Number.isFinite(Number(d.budget))&&d.expenses.every(x=>x&&typeof x.id==='string')&&d.contracts.every(x=>x&&Array.isArray(x.installments))}
function normalizeData(d){d.purchases=Array.isArray(d.purchases)?d.purchases:[];d.events=Array.isArray(d.events)?d.events:[];d.costPlan=d.costPlan&&typeof d.costPlan==='object'?d.costPlan:{};d.checklists=d.checklists&&typeof d.checklists==='object'?d.checklists:{};d.stageProgress=d.stageProgress&&typeof d.stageProgress==='object'?d.stageProgress:{};d.receiptQuality=['small','balanced','high','original'].includes(d.receiptQuality)?d.receiptQuality:'balanced';d.finance={...fresh().finance,...(d.finance||{})};d.finance.stageBudgets=d.finance.stageBudgets||{};d.finance.stageModes=d.finance.stageModes||{};d.finance.stageExtras=d.finance.stageExtras||{};for(const p of Object.values(d.stageProgress)){if(p.completedAt&&!p.actualEnd)p.actualEnd=p.completedAt}for(const x of d.expenses){if(!Array.isArray(x.payments)){x.payments=[{id:uid(),amount:num(x.amount),date:x.date||today(),legacy:true}];x.paymentState='known'}if(!x.paymentState)x.paymentState='known'}if(d.purchases.length){const seen=new Set(d.expenses.filter(x=>x.legacyPurchaseId).map(x=>x.legacyPurchaseId));for(const p of d.purchases){if(seen.has(p.id))continue;d.expenses.push({id:uid(),legacyPurchaseId:p.id,title:p.name,amount:num(p.quantity)*num(p.unitPrice),quantity:p.quantity,unitPrice:p.unitPrice,measure:p.measure,vendor:p.vendor||'',date:p.date||today(),stage:p.stage||STAGES[0],unit:p.unit||UNITS[0],notes:p.notes||'',payments:[],paymentState:'review',docId:null});seen.add(p.id)}d.purchases=[]}return d}
function nav(p){page=p;render();window.scrollTo(0,0)}
function render(){let current=NAV.find(x=>x[0]===page)||NAV[0];$('#pagetitle').textContent=current[2];$('#pagesub').textContent=({home:'نظرة شاملة على مشروع الفيلا',expenses:'المصاريف والدفعات والمبالغ المتبقية',contracts:'العقود والدفعات وشروط الاستحقاق',stages:'المخطط والفعلي لكل مرحلة',budgetplan:'تقدير تكلفة البناء وميزانيات المراحل',finance:'احتياج السيولة كل 6 أشهر أو سنة',documents:'أرشيف فواتير PDF',reports:'قراءة دقيقة للوضع المالي',journal:'إنجازات وملاحظات وقرارات المشروع',settings:'إعدادات المشروع والنسخ الاحتياطية'})[page];$('#sidenav').innerHTML=NAV.map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="nav('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');$('#tabbar').innerHTML=[NAV[0],NAV[1],NAV[2],NAV[4],NAV[6]].map(x=>`<button class="${page===x[0]?'active':''}" onclick="nav('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');$('#content').innerHTML=({home:home,expenses:expenses,contracts:contracts,stages:stages,finance:financePage,budgetplan:budgetPage,documents:documents,reports:reports,journal:journalPage,settings:settings})[page]();}
function payments(c){return c.installments.flatMap(i=>i.payments||[])}function paid(c){return sum(payments(c).map(p=>p.amount))}function dueStatus(i){let p=sum((i.payments||[]).map(x=>x.amount)),a=num(i.amount);if(p>=a-.005)return ['مدفوعة','ok'];if(p>0)return ['مدفوعة جزئيًا','warn'];if(i.basis==='condition'&&!i.fulfilled)return ['بانتظار الشرط',''];if(i.basis==='both'&&!i.fulfilled)return ['بانتظار الشرط',''];if(i.dueDate&&i.dueDate>today())return ['قادمة',''];if(i.dueDate&&i.dueDate<today())return ['متأخرة','red'];if(i.basis==='date'&&!i.dueDate)return ['دون تاريخ','warn'];return ['مستحقة','warn']}
function expensePaid(x){return sum((x.payments||[]).map(p=>p.amount))}function expenseRest(x){return Math.max(0,num(x.amount)-expensePaid(x))}function totals(){let exp=sum(data.expenses.map(expensePaid)),contractPaid=sum(data.contracts.map(paid)),contractObligation=sum(data.contracts.map(c=>Math.max(0,num(c.value)-paid(c)))),expenseObligation=sum(data.expenses.filter(x=>x.paymentState!=='review').map(expenseRest)),due=sum(data.contracts.flatMap(c=>c.installments.filter(i=>['مستحقة','متأخرة','مدفوعة جزئيًا'].includes(dueStatus(i)[0])).map(i=>Math.max(0,num(i.amount)-sum((i.payments||[]).map(p=>p.amount))))));let review=sum(data.expenses.filter(x=>x.paymentState==='review').map(x=>x.amount));return {exp,contractPaid,spent:exp+contractPaid,obligation:contractObligation+expenseObligation,due,review,remaining:num(data.budget)-exp-contractPaid-contractObligation-expenseObligation}}
function home(){let t=totals(),fp=financeDetailed(0);return `<div class="notice"><b>التمويل خلال 6 أشهر:</b> مستحقات ${money(fp.nextDue)}، وتكاليف تقديرية ${money(fp.nextEstimated)}، ${fp.maxGap?'وأكبر عجز متوقع '+money(fp.maxGap):'ولا يظهر عجز متوقع'}. <button class="btn tiny" onclick="nav('reports')">خريطة التمويل والتقارير</button></div><div class="cards">${[['الميزانية',data.budget,'الميزانية المعتمدة'],['المدفوع فعليًا',t.spent,'مصاريف + دفعات عقود'],['المتبقي من الالتزامات',t.obligation,'دون السجلات التي تحتاج مراجعة'],['المتاح بعد الالتزامات',t.remaining,'الميزانية ناقص المدفوع والالتزامات']].map(x=>`<div class="card"><div class="lbl">${x[0]}</div><div class="val">${money(x[1])}</div><div class="hint">${x[2]}</div></div>`).join('')}</div>${t.review?`<div class="notice">⚠️ توجد مشتريات قديمة بقيمة ${money(t.review)} تحتاج مراجعة حالة السداد، ولا تُحسب ضمن المدفوع أو الالتزامات حتى تؤكدها. <button class="btn tiny" onclick="nav('expenses')">مراجعة</button></div>`:''}<div class="panel"><h3>التنفيذ الميداني</h3><p>سجل الإنجازات والملاحظات المهمة عند الحاجة فقط، وتابع استلام مراحل البناء.</p><div class="actions"><button class="btn primary" onclick="nav('journal')">سجل الأحداث</button><button class="btn" onclick="nav('stages')">متابعة الإنجاز</button></div></div><div class="panel"><h3>التخطيط المالي</h3><p>خطة الوصول إلى السكن خلال ${num(data.finance.months)} شهرًا (افتراضيًا 39 شهرًا)، وحديقة السطح خارج المدة. أدخل تاريخ الانطلاق وميزانيات المراحل لتظهر توقعات السيولة.</p><div class="actions"><button class="btn primary" onclick="nav('finance')">الخطة المالية</button><button class="btn" onclick="nav('stages')">مراحل البناء</button><button class="btn" onclick="expenseModal()">+ مصروف</button></div></div>`}
function expenses(){let rows=[...data.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||''));let review=rows.filter(x=>x.paymentState==='review').length;return `<div class="section" style="margin-top:0"><h2>المصاريف <span class="muted mini">(${rows.length})</span></h2><button class="btn primary" onclick="expenseModal()">+ إضافة مصروف</button></div><div class="notice">كل عملية تُسجل مرة واحدة؛ الدفعات مرتبطة بها. ${review?`هناك ${review} عملية مشتريات قديمة تحتاج مراجعة السداد.`:'يمكنك تسجيل مبلغ مؤجل أو دفعه على دفعات.'} دفعات العقود لا تدخل هنا مرة ثانية.</div><div class="panel"><div class="formgrid" style="margin-bottom:15px"><div class="field"><label>بحث</label><input id="exsearch" placeholder="الوصف أو المورد" oninput="filterExpenses()"></div><div class="field"><label>المرحلة</label><select id="exstage" onchange="filterExpenses()"><option value="">كل المراحل</option>${STAGES.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>المصروف</th><th>المرحلة</th><th>القيمة</th><th>المدفوع</th><th>المتبقي</th><th>الإجراء</th></tr></thead><tbody id="exrows">${expenseRows(rows)}</tbody></table></div></div>`}
function expenseRows(rows){return rows.length?rows.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="muted mini">${esc(x.vendor||'')} · ${datefmt(x.date)} ${x.docId?' · 📎':''}</div>${x.paymentState==='review'?'<span class="pill warn">تحتاج مراجعة السداد</span>':''}${x.quantity?`<div class="muted mini">${moneyQty(x.quantity)} ${esc(x.measure||'')} × ${money(x.unitPrice)}</div>`:''}</td><td>${esc(x.stage)}</td><td>${money(x.amount)}</td><td>${x.paymentState==='review'?'غير معروف':money(expensePaid(x))}</td><td>${x.paymentState==='review'?'غير معروف':money(expenseRest(x))}</td><td><button class="btn tiny" onclick="expenseModal('${x.id}')">تعديل</button> <button class="btn tiny" onclick="expenseDetails('${x.id}')">الدفعات</button> <button class="btn tiny danger" onclick="deleteExpense('${x.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">لا توجد نتائج</td></tr>'}
function filterExpenses(){let q=$('#exsearch').value.trim().toLowerCase(),s=$('#exstage').value;$('#exrows').innerHTML=expenseRows(data.expenses.filter(x=>(!q||((x.title||'')+' '+(x.vendor||'')).toLowerCase().includes(q))&&(!s||x.stage===s)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')))}
function contracts(){return `<div class="section" style="margin-top:0"><h2>العقود <span class="muted mini">(${data.contracts.length})</span></h2><button class="btn primary" onclick="contractModal()">+ عقد جديد</button></div><div class="notice">يُعد الشرط مستحقًا فقط بعد تسجيل تحققه. الدفعات المؤرخة تُتابع حسب تاريخها، والدفعات التي تجمع الشرط والتاريخ تتطلب تحقق الشرط وبلوغ التاريخ.</div>${data.contracts.length?data.contracts.map(c=>{let p=paid(c),inst=c.installments;return `<div class="contract"><div class="contracthead"><div><h3>${esc(c.title)}</h3><div class="meta">${esc(c.party)} · ${esc(c.stage)} · ${esc(c.unit)}</div></div><div><b>${money(c.value)}</b><div class="muted mini">مدفوع ${money(p)}</div></div></div><div class="bar"><i style="width:${Math.min(100,num(c.value)?p/c.value*100:0)}%"></i></div><div class="contractdetails"><div class="tablewrap"><table class="tbl"><thead><tr><th>الدفعة</th><th>المبلغ</th><th>موعد / شرط الاستحقاق</th><th>الحالة</th><th>المتبقي</th><th>إجراء</th></tr></thead><tbody>${inst.map(i=>{let r=num(i.amount)-sum((i.payments||[]).map(x=>x.amount));return `<tr><td>${esc(i.label)}</td><td>${money(i.amount)}</td><td>${i.condition?esc(i.condition):''}${i.dueDate?'<div class="muted mini">'+datefmt(i.dueDate)+'</div>':''}</td><td><span class="pill ${dueStatus(i)[1]}">${dueStatus(i)[0]}</span></td><td>${money(Math.max(0,r))}</td><td><div class="actions">${i.basis!=='date'&&!i.fulfilled?`<button class="btn tiny" onclick="fulfill('${c.id}','${i.id}')">تحقق الشرط</button>`:''}${r>.005?`<button class="btn tiny primary" onclick="paymentModal('${c.id}','${i.id}')">سداد</button>`:''}<button class="btn tiny" onclick="installmentDetails('${c.id}','${i.id}')">التفاصيل</button></div></td></tr>`}).join('')}</tbody></table></div><div class="actions" style="margin-top:13px"><button class="btn tiny" onclick="contractModal('${c.id}')">تعديل العقد والجدول</button><button class="btn tiny danger" onclick="deleteContract('${c.id}')">حذف العقد</button></div></div></div>`}).join(''):'<div class="panel empty">لم تُضف عقود بعد. ابدأ بعقد المكتب الهندسي أو مقاول العظم.</div>'}`}
function documents(){return `<div class="section" style="margin-top:0"><h2>أرشيف الفواتير <span class="muted mini">(${data.docs.length})</span></h2></div><div class="notice">في هذا الإصدار تُرفق ملفات PDF الجاهزة فقط. تصوير الفاتورة وتحويلها إلى PDF داخل التطبيق قيد التطوير. تُضمَّن المرفقات في ملف المشروع عند التصدير.</div><div class="panel" style="margin-top:15px">${data.docs.length?data.docs.map(d=>`<div class="fileline"><div><b>▧ ${esc(d.name)}</b><div class="muted mini">${(d.size/1024).toFixed(0)} كيلوبايت · ${esc(d.ownerType==='expense'?'مصروف':'دفعة عقد')}</div></div><button class="btn tiny" onclick="viewDoc('${d.id}')">فتح PDF</button></div>`).join(''):'<div class="empty">لا توجد فواتير. أرفق PDF عند إضافة مصروف أو تسجيل دفعة.</div>'}</div>`}

function purchases(){let rows=[...data.purchases].sort((a,b)=>b.date.localeCompare(a.date));let total=sum(rows.map(x=>x.quantity*x.unitPrice));return `<div class="section" style="margin-top:0"><h2>سجل المشتريات <span class="muted mini">(${rows.length})</span></h2><button class="btn primary" onclick="purchaseModal()">+ إضافة مادة</button><button class="btn" onclick="exportPurchasesCSV()">تصدير CSV</button></div><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px"><div class="card"><div class="lbl">قيمة المواد المسجلة</div><div class="val">${money(total)}</div><div class="hint">مؤشر معلوماتي، لا يُضاف تلقائيًا إلى المصروفات</div></div><div class="card"><div class="lbl">عدد سجلات المشتريات</div><div class="val">${rows.length}</div></div></div><div class="panel"><p class="muted mini">لتجنب ازدواجية الحساب، سجّل مبلغ الشراء في «المصروفات» عند الدفع، واستخدم هذه الصفحة لتفاصيل الكمية وسعر الوحدة والمورد.</p><div class="tablewrap"><table class="tbl"><thead><tr><th>المادة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>المورد</th><th>المرحلة</th><th>الإجراء</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted mini">${datefmt(x.date)}</div></td><td>${moneyQty(x.quantity)} ${esc(x.measure)}</td><td>${money(x.unitPrice)}</td><td><b>${money(x.quantity*x.unitPrice)}</b></td><td>${esc(x.vendor)}</td><td>${esc(x.stage)}</td><td><button class="btn tiny" onclick="purchaseModal('${x.id}')">تعديل</button> <button class="btn tiny danger" onclick="deletePurchase('${x.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">لم تُسجل مشتريات بعد</td></tr>'}</tbody></table></div></div>`}
function moneyQty(n){return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:3}).format(num(n))}
function purchaseModal(id){let x=data.purchases.find(x=>x.id===id)||{name:'',quantity:1,unitPrice:'',measure:'حبة',vendor:'',date:today(),stage:STAGES[0],unit:UNITS[0],notes:''};modal(`<h2>${id?'تعديل شراء':'إضافة شراء / مادة'}</h2><form onsubmit="submitPurchase(event,'${id||''}')"><div class="formgrid">${field('اسم المادة *','name',x.name)}${field('الكمية *','quantity',x.quantity,'number','min="0.001" step="0.001" required')}${field('سعر الوحدة *','unitPrice',x.unitPrice,'number','min="0" step="0.01" required')}${field('وحدة القياس','measure',x.measure)}${field('المورد','vendor',x.vendor)}${field('تاريخ الشراء','date',x.date,'date')}<div class="field"><label>المرحلة</label><select name="stage">${opts(STAGES,x.stage)}</select></div><div class="field"><label>الوحدة / الدور</label><select name="unit">${opts(UNITS,x.unit)}</select></div><div class="field full"><label>ملاحظات</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><p class="notice">هذه بطاقة تفاصيل شراء، ولا تُسجّل دفعة مالية تلقائيًا. أضف المصروف في صفحة المصروفات لمنع التكرار.</p><div class="modalfoot"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}
function submitPurchase(e,id){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));let q=Number(v.quantity),price=Number(v.unitPrice);if(!v.name.trim()||!Number.isFinite(q)||q<=0||!Number.isFinite(price)||price<0)return toast('تحقق من المادة والكمية والسعر');let x=data.purchases.find(x=>x.id===id);if(!x){x={id:uid()};data.purchases.push(x)}Object.assign(x,{name:v.name.trim(),quantity:q,unitPrice:price,measure:v.measure.trim(),vendor:v.vendor.trim(),date:v.date||today(),stage:v.stage,unit:v.unit,notes:v.notes});closeModal();mark();toast('تم حفظ المادة')}
function deletePurchase(id){if(!confirm('حذف سجل الشراء؟'))return;data.purchases=data.purchases.filter(x=>x.id!==id);mark()}
function stages(){let done=STAGES.filter(s=>data.stageProgress[s]?.status==='done').length;return `<div class="section" style="margin-top:0"><h2>مراحل البناء</h2><span class="pill ok">${done} / ${STAGES.length} مكتملة</span></div><div class="notice">المشروع يبدأ وجميع مراحله «لم تبدأ». أدخل التاريخ المخطط والفعلي بالميلادي؛ وسيظهر الميلادي والهجري معًا. حديقة السطح اختيارية خارج مدة الوصول للسكن، لكن العزل والتصريف الأساسيين ضمن البناء.</div><div class="panel">${STAGES.map((s,i)=>{let p=data.stageProgress[s]||{},garden=isGarden(s);return `<div class="stageitem"><div style="flex:1;min-width:180px"><b>${i+1}. ${esc(s)}</b>${garden?'<span class="pill">خارج مدة السكن</span>':''}<div class="muted mini">الإنجاز: ${stagePercent(s)}% · مخطط: ${datefmt(p.plannedStart)} — ${datefmt(p.plannedEnd)} | فعلي: ${datefmt(p.actualStart)} — ${datefmt(p.actualEnd)}</div></div><select aria-label="حالة ${esc(s)}" onchange="updateStage(${i},this.value)"><option value="not_started" ${!p.status||p.status==='not_started'?'selected':''}>لم تبدأ</option><option value="active" ${p.status==='active'?'selected':''}>قيد التنفيذ</option><option value="done" ${p.status==='done'?'selected':''}>مكتملة</option></select><button class="btn tiny" onclick="stageDates(${i})">التواريخ</button><button class="btn tiny" onclick="stageTracking(${i})">الإنجاز والاستلام</button><button class="btn tiny" onclick="stageNote(${i})">ملاحظات</button></div>`}).join('')}</div>`}
function updateStage(i,status){let s=STAGES[i],p=data.stageProgress[s]||{};p.status=status;if(status==='done')p.percent=100;else if(status==='not_started')p.percent=0;else if(num(p.percent)>=100)p.percent=99;if(status==='active'&&!p.actualStart)p.actualStart=today();if(status==='done'){if(!p.actualStart)p.actualStart=today();if(!p.actualEnd)p.actualEnd=today()}data.stageProgress[s]=p;mark()}
function stageNote(i){let s=STAGES[i],p=data.stageProgress[s]||{};let n=prompt('ملاحظات المرحلة: '+s,p.notes||'');if(n===null)return;data.stageProgress[s]={...p,notes:n};mark();toast('تم حفظ الملاحظات')}

function monthKey(d){return d.getFullYear()*12+d.getMonth()}
function monthLabel(k){let y=Math.floor(k/12),m=k%12;return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'short',year:'numeric'}).format(new Date(y,m,1))}
function financeDetailed(scenario=0){let f=data.finance,months=Math.max(1,num(f.months)||39),start=f.startDate?new Date(f.startDate+'T12:00:00'):new Date(),base=monthKey(start),current=monthKey(new Date()),horizon=Math.max(months,current-base+7,6),firm=Array(horizon).fill(0),estimated=Array(horizon).fill(0),items=[],undated=0,outside=0,unknown=0;
const put=(m,v,type,title,stage,provisional=false)=>{v=num(v);if(v<=.005)return;let idx=Math.max(0,Math.floor(m));if(idx>=horizon){outside+=v;return}let a=type==='firm'?firm:estimated;a[idx]+=v;if(type==='firm')items.push({idx,amount:v,title,stage,provisional})};
for(let s of STAGES){if(isGarden(s))continue;let mode=financeMode(s),extra=mode==='contracts'?0:mode==='mixed'?num(f.stageExtras[s]):Math.max(0,num(f.stageBudgets[s])-stageCommit(s)-stageExpenseCommit(s));let [a,b]=windowFor(s),lo=Math.max(0,Math.floor(a)),hi=Math.min(horizon,Math.max(lo+1,Math.ceil(b)));if(extra>0&&hi>lo)for(let m=lo;m<hi;m++)put(m,extra*(1+num(f.reserve)/100)*(1+scenario/100)/(hi-lo),'estimate','تكلفة تقديرية',s)}
for(let x of data.expenses){if(isGarden(x.stage))continue;if(x.paymentState==='review'){unknown+=num(x.amount);continue}let v=expenseRest(x);if(v<=.005)continue;let m=monthOffset(x.dueDate||x.date||'',f.startDate),provisional=!x.dueDate;if(m===null){undated++;m=windowFor(x.stage)[0];provisional=true}put(m,v,'firm',x.title||'مصروف',x.stage,provisional)}
for(let c of data.contracts){if(isGarden(c.stage))continue;for(let i of c.installments){let v=Math.max(0,num(i.amount)-sum((i.payments||[]).map(p=>p.amount)));if(v<=.005)continue;let m=monthOffset(i.dueDate||'',f.startDate),provisional=!i.dueDate;if(m===null){undated++;m=windowFor(c.stage)[0]}put(m,v,'firm',c.title||c.name||'دفعة عقد',c.stage,provisional)}}
let rows=[],balance=num(f.cash),first=null,worst=0,requiredFunding=Math.max(0,-balance);for(let m=0;m<horizon;m++){let before=balance;balance+=num(f.monthlySaving)-firm[m]-estimated[m];if(balance<-.005&&first===null)first=m;worst=Math.min(worst,balance);requiredFunding=Math.max(requiredFunding,-balance);rows.push({idx:m,key:base+m,label:monthLabel(base+m),firm:firm[m],estimated:estimated[m],due:firm[m]+estimated[m],saving:num(f.monthlySaving),before,balance})}let begin=Math.max(0,current-base),next=rows.slice(begin,begin+6),firstFuture=next.find(r=>r.balance<-.005),maxGap=Math.max(0,...next.map(r=>-r.balance)),nextDue=sum(next.map(r=>r.firm)),nextEstimated=sum(next.map(r=>r.estimated));return {rows,next,items,first,firstFuture,maxGap,nextDue,nextEstimated,unknown,undated,outside,requiredFunding,base,current,hasPlan:!!f.startDate,scenario}}
function svgTrend(rows){if(!rows.length)return '<div class="empty">لا توجد أشهر للعرض</div>';let w=680,h=210,p=38,values=rows.map(r=>r.balance),min=Math.min(0,...values),max=Math.max(0,...values),range=max-min||1,x=i=>p+(w-2*p)*(rows.length===1?.5:i/(rows.length-1)),y=v=>h-p-(v-min)/range*(h-2*p),pts=rows.map((r,i)=>x(i)+','+y(r.balance)).join(' '),zero=y(0);return `<svg class="fchart" viewBox="0 0 ${w} ${h}" role="img" aria-label="الرصيد المتوقع شهريًا"><line x1="${p}" y1="${zero}" x2="${w-p}" y2="${zero}" stroke="#64748b" stroke-dasharray="5 5"/><polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.balance)}" r="5" fill="${r.balance<0?'#dc2626':'#2563eb'}"><title>${esc(r.label)}: ${money(r.balance)}</title></circle><text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="currentColor">${i+1}</text>`).join('')}<text x="${w-p}" y="${Math.max(12,zero-7)}" text-anchor="end" font-size="11" fill="currentColor">صفر</text></svg><p class="muted mini">الأرقام أسفل الرسم تمثل الأشهر القادمة 1–${rows.length}. النقاط الحمراء تعني رصيدًا سالبًا.</p>`}

const STAGE_WINDOWS=[[0,6],[5,9],[7,13],[10,19],[14,23],[16,26],[16,26],[19,31],[23,31],[27,35],[29,37],[29,38],[33,39],[39,42],[33,39]];
function plusMonths(iso,n){if(!iso)return '';let d=new Date(iso+'T12:00:00');let day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.toISOString().slice(0,10)}
function monthOffset(iso,start){if(!iso||!start)return null;let a=new Date(start+'T12:00:00'),b=new Date(iso+'T12:00:00');return (b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+(b.getDate()-a.getDate())/31}
function windowFor(s){let i=STAGES.indexOf(s),w=STAGE_WINDOWS[i]||[0,39],factor=num(data.finance.months)/39,p=data.stageProgress[s]||{},start=data.finance.startDate;let a=p.plannedStart&&start?monthOffset(p.plannedStart,start):w[0]*factor,b=p.plannedEnd&&start?monthOffset(p.plannedEnd,start):w[1]*factor;return [Math.max(0,a),Math.max(Math.max(0,a)+.1,b)]}
function financeMode(s){return ['estimate','contracts','mixed'].includes(data.finance.stageModes?.[s])?data.finance.stageModes[s]:'estimate'}
function stageCommit(s){return sum(data.contracts.filter(c=>c.stage===s).map(c=>num(c.value)))}
function stageExpenseCommit(s){return sum(data.expenses.filter(x=>x.stage===s&&x.paymentState!=='review').map(x=>num(x.amount)))}
function financePage(){let f=data.finance,plan=f.startDate?financeForecast():null;return `<div class="section" style="margin-top:0"><h2>الخطة المالية والزمنية</h2></div><div class="notice">المدة الأساسية 36–42 شهرًا تقدير تخطيطي. حديقة السطح خارج تاريخ الوصول للسكن. اختر مصدر تكلفة كل مرحلة؛ لا تُدخل قيمة العقد مرة أخرى ضمن الإضافات.</div><div class="panel"><h3>إعدادات التمويل</h3><div class="formgrid">${field('تاريخ بدء المشروع المخطط','startDate',f.startDate,'date')}<div class="field"><label>مدة الوصول للسكن</label><select id="fm">${[36,39,42].map(m=>`<option value="${m}" ${num(f.months)===m?'selected':''}>${m} شهرًا</option>`).join('')}</select></div><div class="field"><label>فترة العرض</label><select id="fp"><option value="6" ${num(f.period)===6?'selected':''}>كل 6 أشهر</option><option value="12" ${num(f.period)===12?'selected':''}>كل سنة</option></select></div>${field('السيولة المتاحة عند بداية الخطة (ر.س)','cash',f.cash,'number','step="0.01"')}${field('التوفير الشهري المتوقع (ر.س)','monthlySaving',f.monthlySaving,'number','min="0" step="0.01"')}${field('احتياطي طوارئ على التقديرات فقط (%)','reserve',f.reserve,'number','min="0" max="100" step="1"')}</div><div class="actions"><button class="btn primary" onclick="saveFinance()">حفظ الخطة</button></div></div><div class="panel" style="margin-top:16px"><h3>مصدر تكلفة كل مرحلة</h3><p class="muted mini">«تقديري»: الميزانية اليدوية تشمل العقود والمصاريف المعروفة، ويُوزع فقط الباقي. «من العقود»: العقود والمصاريف المسجلة فقط. «مختلط»: العقود والمصاريف المسجلة + مبلغ إضافي غير متعاقد عليه. المبالغ المدفوعة سابقًا لا تُطلب مجددًا.</p><div class="tablewrap"><table class="tbl"><thead><tr><th>المرحلة</th><th>المصدر</th><th>قيمة العقود</th><th>المصاريف المسجلة</th><th>الميزانية/الإضافة</th><th>التوقيت</th></tr></thead><tbody>${STAGES.map(s=>{let w=windowFor(s),mode=financeMode(s),v=mode==='mixed'?num(f.stageExtras[s]):num(f.stageBudgets[s]);return `<tr><td>${esc(s)}${isGarden(s)?'<small class="muted"> · خارج السكن</small>':''}</td><td><select class="stage-mode" data-stage="${esc(s)}" onchange="financeModeChanged(this)" style="max-width:140px"><option value="estimate" ${mode==='estimate'?'selected':''}>تقديري</option><option value="contracts" ${mode==='contracts'?'selected':''}>من العقود</option><option value="mixed" ${mode==='mixed'?'selected':''}>مختلط</option></select></td><td>${money(stageCommit(s))}</td><td>${money(stageExpenseCommit(s))}</td><td><input class="stagebudget" data-stage="${esc(s)}" type="number" min="0" step="0.01" style="max-width:145px" value="${v}" ${mode==='contracts'?'disabled':''}><small class="muted finance-budget-label" style="display:block">${mode==='mixed'?'إضافات غير متعاقد عليها':mode==='contracts'?'لا يلزم إدخال':'إجمالي الميزانية'}</small></td><td>الشهر ${Math.round(w[0])+1}–${Math.ceil(w[1])}</td></tr>`}).join('')}</tbody></table></div><div class="notice">العقود تُسحب تلقائيًا حسب المرحلة وجدول دفعاتها. الدفعات المشروطة بلا تاريخ تُقدر عند بداية المرحلة وتظهر في التنبيهات للمراجعة. عند تعديل مصدر مرحلة احفظ الخطة لإعادة الحساب.</div></div>${plan?financeTable(plan):'<div class="panel" style="margin-top:16px"><h3>التوقعات</h3><p>حدد تاريخ بداية المشروع واضغط حفظ لإظهار احتياج التمويل.</p></div>'}`}
function financeModeChanged(el){let row=el.closest('tr'),input=row.querySelector('.stagebudget'),label=row.querySelector('.finance-budget-label');input.disabled=el.value==='contracts';label.textContent=el.value==='mixed'?'إضافات غير متعاقد عليها':el.value==='contracts'?'لا يلزم إدخال':'إجمالي الميزانية';input.value=el.value==='contracts'?0:(el.value==='mixed'?num(data.finance.stageExtras[el.dataset.stage]):num(data.finance.stageBudgets[el.dataset.stage]))}
function saveFinance(){let f=data.finance,start=$('input[name="startDate"]').value,months=num($('#fm').value),period=num($('#fp').value),cash=Number($('input[name="cash"]').value),saving=Number($('input[name="monthlySaving"]').value),reserve=Number($('input[name="reserve"]').value);if(!Number.isFinite(cash)||!Number.isFinite(saving)||saving<0||!Number.isFinite(reserve)||reserve<0||reserve>100)return toast('تحقق من قيم التمويل');let budgets={...f.stageBudgets},extras={...f.stageExtras},modes={...f.stageModes};for(let el of document.querySelectorAll('.stage-mode')){let s=el.dataset.stage,mode=el.value,input=el.closest('tr').querySelector('.stagebudget'),v=Number(input.value);if(!Number.isFinite(v)||v<0)return toast('قيمة مرحلة غير صحيحة');modes[s]=mode;if(mode==='estimate')budgets[s]=v;if(mode==='mixed')extras[s]=v}Object.assign(f,{startDate:start,months,period,cash,monthlySaving:saving,reserve,stageBudgets:budgets,stageExtras:extras,stageModes:modes});mark();toast('تم تحديث خطة التمويل والعقود')}
function financeForecast(){let f=data.finance,months=num(f.months)||39,period=num(f.period)||6,monthCash=Array(Math.ceil(months)).fill(0),unknown=0,undated=0,outside=0;const put=(m,amount)=>{if(!Number.isFinite(amount)||amount<=0)return;if(m>=monthCash.length){outside+=amount;return}monthCash[Math.max(0,Math.floor(m))]+=amount};const stageMonth=s=>Math.max(0,windowFor(s)[0]);for(const s of STAGES){if(isGarden(s))continue;let mode=financeMode(s),expenseCommit=stageExpenseCommit(s),contractCommit=stageCommit(s),remainder=mode==='contracts'?0:mode==='mixed'?num(f.stageExtras[s]):Math.max(0,num(f.stageBudgets[s])-expenseCommit-contractCommit);let [a,b]=windowFor(s),start=Math.max(0,Math.floor(a)),end=Math.min(monthCash.length,Math.max(start+1,Math.ceil(b)));if(remainder>0&&start<monthCash.length){let n=end-start;for(let k=start;k<end;k++)put(k,remainder*(1+num(f.reserve)/100)/n)}}for(const x of data.expenses){if(isGarden(x.stage))continue;if(x.paymentState==='review'){unknown+=num(x.amount);continue}let rest=expenseRest(x);if(rest>.005){let m=monthOffset(x.dueDate||x.date||'',f.startDate);if(m===null){undated++;m=stageMonth(x.stage)}put(m,rest)}}for(const c of data.contracts){if(isGarden(c.stage))continue;for(const i of c.installments){let rest=Math.max(0,num(i.amount)-sum((i.payments||[]).map(p=>p.amount)));if(rest>.005){let m=monthOffset(i.dueDate||'',f.startDate);if(m===null){undated++;m=stageMonth(c.stage)}put(m,rest)}}}let rows=[],balance=num(f.cash),firstShortage=num(f.cash)<0?0:null;for(let m=0;m<monthCash.length;m++){balance+=num(f.monthlySaving);balance-=monthCash[m];if(balance<-.005&&firstShortage===null)firstShortage=m+1}balance=num(f.cash);for(let k=0;k<monthCash.length;k+=period){let required=sum(monthCash.slice(k,k+period)),saving=num(f.monthlySaving)*Math.min(period,monthCash.length-k),available=balance+saving,shortage=Math.max(0,required-available);balance=available-required;rows.push({label:`${k+1}–${Math.min(monthCash.length,k+period)}`,required,saving,available,shortage,balance})}return {rows,firstShortage,unknown,undated,outside,known:sum(monthCash)}}
function financeTable(plan){let f=data.finance,hasEstimate=STAGES.some(s=>!isGarden(s)&&(num(f.stageBudgets[s])>0||num(f.stageExtras[s])>0))||data.contracts.length||data.expenses.some(x=>x.paymentState!=='review');return `<div class="panel" style="margin-top:16px"><h3>احتياج السيولة حسب الفترة</h3>${num(f.cash)<0?`<div class="notice" role="alert" style="border:1px solid #d97706;background:#fff3dc;color:#713f12">⚠️ تنبيه: السيولة المدخلة سالبة (${money(f.cash)}). لديك عجز قائم قبل بدء الخطة، ويجب تغطيته أو مراجعة الرصيد الابتدائي.</div>`:''}${plan.firstShortage?`<div class="notice" role="alert" style="border:1px solid #d97706;background:#fff3dc;color:#713f12">⚠️ تنبيه عجز سيولة متوقع: ${plan.firstShortage===0?'موجود من بداية الخطة':'يبدأ في الشهر '+plan.firstShortage+' من المشروع'}. راجع مواعيد الدفعات أو وفر تمويلًا إضافيًا قبل هذا الشهر.</div>`:''}${!hasEstimate?'<div class="notice">لم تدخل ميزانيات المراحل أو التزامات معروفة بعد؛ النتائج الصفرية لا تعني أن البناء بلا تكلفة.</div>':''}${plan.unknown?`<div class="notice">⚠️ مشتريات قديمة بقيمة ${money(plan.unknown)} تحتاج مراجعة السداد؛ لم تدخل في التوقع.</div>`:''}${plan.undated?`<div class="notice">⚠️ ${plan.undated} دفعة/مصروف بلا تاريخ استحقاق واضح؛ وُضع مؤقتًا عند بداية المرحلة. راجع مواعيده.</div>`:''}${plan.outside?`<div class="notice">⚠️ التزامات بقيمة ${money(plan.outside)} تقع بعد نهاية مدة التخطيط؛ لم تُحتسب في جدول الفترات.</div>`:''}<p class="muted mini">توزيع المبالغ التقديرية فقط على أشهر المرحلة، ودفعات العقود والمصاريف غير المدفوعة وفق تواريخها. يُستبعد ما سُدد سابقًا. حديقة السطح مستقلة ولا تدخل في احتياج الوصول للسكن.</p><div class="tablewrap"><table class="tbl"><thead><tr><th>الأشهر</th><th>المطلوب</th><th>التوفير المتوقع</th><th>الفجوة</th><th>الرصيد المتوقع</th></tr></thead><tbody>${plan.rows.map(r=>`<tr><td>${r.label}</td><td>${money(r.required)}</td><td>${money(r.saving)}</td><td><b>${money(r.shortage)}</b></td><td>${money(r.balance)}</td></tr>`).join('')}</tbody></table></div><div class="notice">${plan.firstShortage!==null?(plan.firstShortage===0?'عجز سيولة قائم عند بداية الخطة.':'أول شهر متوقع لنقص السيولة: الشهر '+plan.firstShortage):'لا يظهر نقص سيولة ضمن الافتراضات المدخلة.'} الحسابات تقديرية وليست جدول مقاول معتمدًا.</div></div>`}

function journalPage(){let events=[...(data.events||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||'').localeCompare(a.created||''));let open=events.filter(x=>x.type==='ملاحظة أو مشكلة'&&x.state!=='مغلقة').length;let stageSelect='<option value="">كل المراحل</option>'+STAGES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');return `<div class="section" style="margin-top:0"><h2>سجل أحداث المشروع</h2><button class="btn primary" onclick="eventModal()">+ إضافة حدث</button></div><div class="notice">سجل ما يستحق التوثيق فقط، دون إدخال يومي أو شهري إلزامي. تظهر الأحداث مجمعة حسب الشهر، وتُحفظ الصور ضمن ملف النسخة الاحتياطية .villa.</div><div class="cards"><div class="card"><div class="lbl">الأحداث المسجلة</div><div class="val">${events.length}</div></div><div class="card"><div class="lbl">ملاحظات تحتاج متابعة</div><div class="val">${open}</div></div><div class="card"><div class="lbl">المراحل المكتملة</div><div class="val">${STAGES.filter(s=>data.stageProgress[s]?.status==='done').length} / ${STAGES.length}</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>تصفية حسب النوع</label><select id="eventTypeFilter" onchange="filterJournal()"><option value="">كل الأنواع</option>${EVENT_TYPES.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>تصفية حسب المرحلة</label><select id="eventStageFilter" onchange="filterJournal()">${stageSelect}</select></div><div class="field"><label>حالة الملاحظة</label><select id="eventStateFilter" onchange="filterJournal()"><option value="">كل الحالات</option>${EVENT_STATES.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div></div><div id="journalList"></div></div><div class="panel" style="margin-top:15px"><h3>إنجاز المراحل</h3>${STAGES.map((s,i)=>`<div class="journal-row"><div style="flex:1"><b>${esc(s)}</b><div class="progress-track"><div style="width:${stagePercent(s)}%"></div></div><div class="muted mini">${stagePercent(s)}% · ${data.stag
