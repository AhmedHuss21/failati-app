:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#172033;background:#f6f7fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#fff;border-left:1px solid #e8eaf0;padding:28px 16px;position:sticky;top:0;height:100vh}.brand{font-size:28px;font-weight:800;letter-spacing:-1px;padding:6px 14px 25px}.brand small{display:block;font-size:11px;font-weight:500;color:#8790a0;letter-spacing:0;margin-top:5px}.nav{width:100%;border:0;background:transparent;text-align:right;padding:13px 14px;border-radius:13px;margin:3px 0;color:#667085;font-weight:650}.nav.active{background:#eaf1ff;color:#2464db}.nav span{display:inline-block;width:27px}.sidefoot{position:absolute;bottom:24px;right:16px;left:16px;font-size:12px;color:#8590a1;line-height:1.9}.main{min-width:0;padding:32px 38px 60px;max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.top h1{font-size:28px;letter-spacing:-.8px;margin:0}.sub{color:#8790a0;font-size:13px;margin-top:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #dfe3eb;background:white;color:#27344a;border-radius:12px;padding:10px 15px;font-weight:650;min-height:41px}.btn.primary{background:#2468e8;color:white;border-color:#2468e8}.btn.danger{color:#c73543}.btn.tiny{font-size:12px;padding:6px 9px;min-height:30px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid #e9ebf1;border-radius:19px;padding:20px;box-shadow:0 5px 25px #152b4d05}.card .lbl{color:#7d8797;font-size:13px}.card .val{font-size:24px;font-weight:800;margin:12px 0 4px;direction:ltr;text-align:right}.card .hint{font-size:11px;color:#9ca5b3}.section{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px;gap:10px}.section h2{margin:0;font-size:19px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.muted{color:#8790a0}.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#eef2f8;color:#607084}.pill.ok{background:#e8f8ee;color:#13804a}.pill.warn{background:#fff3d9;color:#94600a}.pill.red{background:#ffebee;color:#bc3342}.listrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eef0f4}.listrow:last-child{border:0}.listrow strong{font-size:14px}.listrow small{display:block;color:#8b95a5;margin-top:5px}.amount{font-weight:800;white-space:nowrap}.empty{padding:35px 10px;text-align:center;color:#8a94a5;font-size:14px}.bar{height:9px;border-radius:20px;background:#eef1f6;overflow:hidden;margin-top:12px}.bar>i{display:block;background:#3577e8;height:100%;border-radius:20px}.tablewrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;text-align:right;min-width:650px}.tbl th{font-size:12px;color:#8790a0;font-weight:650;padding:12px 10px;background:#fafbfe}.tbl td{padding:13px 10px;border-bottom:1px solid #eef0f4;font-size:13px;vertical-align:middle}.tbl tr:last-child td{border:0}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field label{font-size:12px;font-weight:700;color:#667085}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dfe3eb;border-radius:11px;background:white;outline:none;min-height:43px;color:#18243a}.field textarea{resize:vertical;min-height:75px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#4480ec;box-shadow:0 0 0 3px #4480ec18}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#101a2c75;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:#fff;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:24px;box-shadow:0 30px 80px #0002}.modal h2{margin:0 0 18px;font-size:21px}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:22px;flex-wrap:wrap}.installment{border:1px solid #e5e9f0;border-radius:14px;padding:14px;margin-top:11px;background:#fcfdff}.installmenthead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.contract{padding:18px;border:1px solid #e8ebf1;border-radius:16px;margin:12px 0;background:#fff}.contracthead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.contract h3{margin:0 0 5px;font-size:17px}.contract .meta{font-size:12px;color:#8b95a5}.contractdetails{margin-top:15px;border-top:1px solid #eef0f4;padding-top:12px}.notice{background:#fff9e9;border:1px solid #ffe9ad;border-radius:13px;padding:13px;color:#785d23;font-size:12px;line-height:1.9}.green{color:#15824d}.redtext{color:#c73543}.mini{font-size:12px}.toast{position:fixed;bottom:25px;left:25px;background:#1d293b;color:white;padding:12px 18px;border-radius:12px;z-index:30;max-width:85vw;font-size:13px;box-shadow:0 12px 25px #0002}.tabbar{display:none}.fileline{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #edf0f5;border-radius:12px;padding:11px;margin-top:8px}.hide{display:none!important}@media(max-width:950px){.app{grid-template-columns:190px 1fr}.main{padding:25px 20px 70px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:650px){.app{display:block}.side{display:none}.main{padding:23px 15px 100px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:25px}.cards{gap:9px}.card{padding:15px}.card .val{font-size:19px}.panel{padding:15px}.formgrid{grid-template-columns:1fr}.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8ebf1;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}.tabbar button{border:0;background:none;color:#8a95a5;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:58px}.tabbar button.active{color:#2365e5;font-weight:800}.tabbar b{font-size:19px}.modal{padding:18px;max-height:88vh}.contracthead{flex-direction:column}}

</head><body><div class="app"><aside class="side"><div class="brand">⌂ فيلتي<small>إدارة مشروع بناء منزلك</small></div><div id="sidenav"></div><div class="sidefoot">يعمل محليًا • دون مزامنة<br>احفظ نسخة من مشروعك بانتظام</div></aside><main class="main"><header class="top"><div><h1 id="pagetitle">الرئيسية</h1><div class="sub" id="pagesub">نظرة شاملة على مشروع الفيلا</div></div><div class="actions"><select aria-label="الانتقال إلى قسم" style="border:1px solid #dfe3eb;border-radius:12px;padding:9px;background:white" onchange="nav(this.value);this.value=''"><option value="">جميع الأقسام ▾</option><option value="purchases">المشتريات</option><option value="stages">مراحل البناء</option><option value="documents">الفواتير</option><option value="reports">التقارير</option><option value="settings">الإعدادات</option></select><button class="btn" onclick="openProject()">↥ فتح مشروع</button><button class="btn primary" onclick="saveProject()">↧ حفظ في…</button></div></header><div id="content"></div></main></div><div class="tabbar" id="tabbar"></div><div id="modals"></div><div id="toastroot"></div><input id="projectfile" type="file" accept=".villa,.json,application/json,application/octet-stream" hidden onchange="importProject(event)"><input id="receiptfile" type="file" accept="application/pdf,.pdf" hidden onchange="receiptChosen(event)"><script>
'use strict';
const STAGES=['التصميم والتراخيص','الحفر وتجهيز الموقع','القواعد والأساسات','العظم والخرسانة','المباني والعزل','الكهرباء','السباكة','التكييف','اللياسة','الأرضيات والسيراميك','الدهانات','الأبواب والنوافذ','التشطيبات النهائية','تنسيق السطح والحديقة','أخرى'];
const UNITS=['مشترك / كامل الفيلا','الدور الأرضي - الدوبلكس','الدور الأول - الدوبلكس','شقة الدور الأول','شقة الملحق','السطح والحديقة'];
const NAV=[['home','⌂','الرئيسية'],['expenses','▤','المصروفات'],['contracts','▣','العقود'],['purchases','▥','المشتريات'],['stages','◉','المراحل'],['documents','▧','الفواتير'],['reports','◫','التقارير'],['settings','⚙','الإعدادات']];
const KEY='vilati_local_v1';const fresh=()=>({schema:1,name:'مشروع فيلتي',budget:0,expenses:[],contracts:[],docs:[],purchases:[],stageProgress:{},receiptQuality:'balanced',created:new Date().toISOString(),modified:new Date().toISOString()});
let data=fresh(),page='home',dirty=false,autoStatus='';let draftFile=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=v=>Number(v)||0;const money=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(num(n))+' ر.س';const datefmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ar-SA'):'—';const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);const today=()=>new Date().toISOString().slice(0,10);const sum=a=>a.reduce((x,y)=>x+num(y),0);
function toast(t){$('#toastroot').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toastroot').innerHTML='',3600)}
function mark(){data.modified=new Date().toISOString();dirty=true;try{localStorage.setItem(KEY,JSON.stringify(data));autoStatus='نسخة مؤقتة على الجهاز';}catch(e){autoStatus='تعذر التخزين المؤقت؛ احفظ ملف المشروع الآن';toast(autoStatus)}render()}
function initialize(){try{const v=localStorage.getItem(KEY);if(v){const d=JSON.parse(v);if(valid(d))data=normalizeData(d)}}catch(e){}render();window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}})}
function valid(d){return d&&d.schema===1&&Array.isArray(d.expenses)&&Array.isArray(d.contracts)&&Array.isArray(d.docs)&&typeof d.name==='string'&&Number.isFinite(Number(d.budget))&&d.expenses.every(x=>x&&typeof x.id==='string')&&d.contracts.every(x=>x&&Array.isArray(x.installments))}
function normalizeData(d){d.purchases=Array.isArray(d.purchases)?d.purchases:[];d.stageProgress=d.stageProgress&&typeof d.stageProgress==='object'?d.stageProgress:{};d.receiptQuality=['small','balanced','high','original'].includes(d.receiptQuality)?d.receiptQuality:'balanced';return d}
function nav(p){page=p;render();window.scrollTo(0,0)}
function render(){let current=NAV.find(x=>x[0]===page)||NAV[0];$('#pagetitle').textContent=current[2];$('#pagesub').textContent=({home:'نظرة شاملة على مشروع الفيلا',expenses:'تتبع كل ريال ومرفقاته',contracts:'العقود والدفعات وشروط الاستحقاق',purchases:'سجل المواد والموردين والكميات',stages:'متابعة إنجاز مراحل البناء',documents:'أرشيف فواتير PDF',reports:'قراءة دقيقة للوضع المالي',settings:'إعدادات المشروع والنسخ الاحتياطية'})[page];$('#sidenav').innerHTML=NAV.map(x=>`<button class="nav ${page===x[0]?'active':''}" onclick="nav('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');$('#tabbar').innerHTML=[NAV[0],NAV[1],NAV[2],NAV[3],NAV[6]].map(x=>`<button class="${page===x[0]?'active':''}" onclick="nav('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');$('#content').innerHTML=({home:home,expenses:expenses,contracts:contracts,purchases:purchases,stages:stages,documents:documents,reports:reports,settings:settings})[page]();}
function payments(c){return c.installments.flatMap(i=>i.payments||[])}function paid(c){return sum(payments(c).map(p=>p.amount))}function dueStatus(i){let p=sum((i.payments||[]).map(x=>x.amount)),a=num(i.amount);if(p>=a-.005)return ['مدفوعة','ok'];if(p>0)return ['مدفوعة جزئيًا','warn'];if(i.basis==='condition'&&!i.fulfilled)return ['بانتظار الشرط',''];if(i.basis==='both'&&!i.fulfilled)return ['بانتظار الشرط',''];if(i.dueDate&&i.dueDate>today())return ['قادمة',''];if(i.dueDate&&i.dueDate<today())return ['متأخرة','red'];if(i.basis==='date'&&!i.dueDate)return ['دون تاريخ','warn'];return ['مستحقة','warn']}
function totals(){let exp=sum(data.expenses.map(x=>x.amount)),contractPaid=sum(data.contracts.map(paid)),obligation=sum(data.contracts.map(c=>Math.max(0,num(c.value)-paid(c)))),due=sum(data.contracts.flatMap(c=>c.installments.filter(i=>['مستحقة','متأخرة','مدفوعة جزئيًا'].includes(dueStatus(i)[0])).map(i=>Math.max(0,num(i.amount)-sum((i.payments||[]).map(p=>p.amount))))));return {exp,contractPaid,spent:exp+contractPaid,obligation,due,remaining:num(data.budget)-exp-contractPaid-obligation}}
function home(){let t=totals(),recent=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),dues=data.contracts.flatMap(c=>c.installments.map(i=>({c,i}))).filter(x=>dueStatus(x.i)[0]!=='مدفوعة').slice(0,6);return `<div class="cards">${[['الميزانية',data.budget,'إجمالي الميزانية المعتمدة'],['المدفوع فعليًا',t.spent,'مصروفات + دفعات عقود'],['التزامات غير مدفوعة',t.obligation,'المتبقي من العقود'],['المتاح بعد الالتزامات',t.remaining,'قد يكون سالبًا']].map(x=>`<div class="card"><div class="lbl">${x[0]}</div><div class="val">${money(x[1])}</div><div class="hint">${x[2]}</div></div>`).join('')}</div><div class="section"><h2>ملخص المشروع</h2><button class="btn tiny" onclick="nav('settings')">تعديل الميزانية</button></div><div class="grid2"><div class="panel"><b>استخدام الميزانية</b><div class="bar"><i style="width:${Math.min(100,Math.max(0,data.budget?t.spent/data.budget*100:0))}%"></i></div><p class="muted mini">المدفوع ${data.budget?(t.spent/data.budget*100).toFixed(1):0}% من الميزانية • مستحق حاليًا ${money(t.due)}</p><div class="section"><h2>أحدث المصروفات</h2><button class="btn tiny" onclick="expenseModal()">+ إضافة مصروف</button></div>${recent.length?recent.map(x=>`<div class="listrow"><div><strong>${esc(x.title)}</strong><small>${esc(x.stage)} · ${datefmt(x.date)}</small></div><span class="amount">${money(x.amount)}</span></div>`).join(''):'<div class="empty">لا توجد مصروفات بعد</div>'}</div><div class="panel"><div class="section" style="margin-top:0"><h2>دفعات العقود</h2><button class="btn tiny" onclick="nav('contracts')">عرض العقود</button></div>${dues.length?dues.map(({c,i})=>`<div class="listrow"><div><strong>${esc(c.title)} — ${esc(i.label)}</strong><small>${esc(i.condition|| (i.dueDate?datefmt(i.dueDate):'لا يوجد تاريخ'))}</small><span class="pill ${dueStatus(i)[1]}">${dueStatus(i)[0]}</span></div><span class="amount">${money(num(i.amount)-sum((i.payments||[]).map(p=>p.amount)))}</span></div>`).join(''):'<div class="empty">لا توجد دفعات معلقة</div>'}</div></div><div class="section"><h2>إجراءات سريعة</h2></div><div class="actions"><button class="btn primary" onclick="expenseModal()">+ مصروف جديد</button><button class="btn" onclick="contractModal()">+ عقد جديد</button><button class="btn" onclick="saveProject()">حفظ نسخة المشروع</button></div>`}
function expenses(){let rows=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="section" style="margin-top:0"><h2>سجل المصروفات <span class="muted mini">(${rows.length})</span></h2><button class="btn primary" onclick="expenseModal()">+ إضافة مصروف</button></div><div class="panel"><div class="formgrid" style="margin-bottom:15px"><div class="field"><label>بحث</label><input id="exsearch" placeholder="الوصف أو المورد" oninput="filterExpenses()"></div><div class="field"><label>المرحلة</label><select id="exstage" onchange="filterExpenses()"><option value="">كل المراحل</option>${STAGES.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>المصروف</th><th>المرحلة</th><th>الوحدة</th><th>التاريخ</th><th>المبلغ</th><th>إجراء</th></tr></thead><tbody id="exrows">${expenseRows(rows)}</tbody></table></div></div>`}
function expenseRows(rows){return rows.length?rows.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="muted mini">${esc(x.vendor||'')}${x.docId?' · 📎 PDF':''}</div></td><td>${esc(x.stage)}</td><td>${esc(x.unit)}</td><td>${datefmt(x.date)}</td><td><b>${money(x.amount)}</b></td><td><button class="btn tiny" onclick="expenseModal('${x.id}')">تعديل</button> <button class="btn tiny danger" onclick="deleteExpense('${x.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">لا توجد نتائج</td></tr>'}
function filterExpenses(){let q=$('#exsearch').value.trim().toLowerCase(),s=$('#exstage').value;$('#exrows').innerHTML=expenseRows(data.expenses.filter(x=>(!q||(x.title+' '+x.vendor).toLowerCase().includes(q))&&(!s||x.stage===s)).sort((a,b)=>b.date.localeCompare(a.date)))}
function contracts(){return `<div class="section" style="margin-top:0"><h2>العقود <span class="muted mini">(${data.contracts.length})</span></h2><button class="btn primary" onclick="contractModal()">+ عقد جديد</button></div><div class="notice">يُعد الشرط مستحقًا فقط بعد تسجيل تحققه. الدفعات المؤرخة تُتابع حسب تاريخها، والدفعات التي تجمع الشرط والتاريخ تتطلب تحقق الشرط وبلوغ التاريخ.</div>${data.contracts.length?data.contracts.map(c=>{let p=paid(c),inst=c.installments;return `<div class="contract"><div class="contracthead"><div><h3>${esc(c.title)}</h3><div class="meta">${esc(c.party)} · ${esc(c.stage)} · ${esc(c.unit)}</div></div><div><b>${money(c.value)}</b><div class="muted mini">مدفوع ${money(p)}</div></div></div><div class="bar"><i style="width:${Math.min(100,num(c.value)?p/c.value*100:0)}%"></i></div><div class="contractdetails"><div class="tablewrap"><table class="tbl"><thead><tr><th>الدفعة</th><th>المبلغ</th><th>موعد / شرط الاستحقاق</th><th>الحالة</th><th>المتبقي</th><th>إجراء</th></tr></thead><tbody>${inst.map(i=>{let r=num(i.amount)-sum((i.payments||[]).map(x=>x.amount));return `<tr><td>${esc(i.label)}</td><td>${money(i.amount)}</td><td>${i.condition?esc(i.condition):''}${i.dueDate?'<div class="muted mini">'+datefmt(i.dueDate)+'</div>':''}</td><td><span class="pill ${dueStatus(i)[1]}">${dueStatus(i)[0]}</span></td><td>${money(Math.max(0,r))}</td><td><div class="actions">${i.basis!=='date'&&!i.fulfilled?`<button class="btn tiny" onclick="fulfill('${c.id}','${i.id}')">تحقق الشرط</button>`:''}${r>.005?`<button class="btn tiny primary" onclick="paymentModal('${c.id}','${i.id}')">سداد</button>`:''}<button class="btn tiny" onclick="installmentDetails('${c.id}','${i.id}')">التفاصيل</button></div></td></tr>`}).join('')}</tbody></table></div><div class="actions" style="margin-top:13px"><button class="btn tiny" onclick="contractModal('${c.id}')">تعديل العقد والجدول</button><button class="btn tiny danger" onclick="deleteContract('${c.id}')">حذف العقد</button></div></div></div>`}).join(''):'<div class="panel empty">لم تُضف عقود بعد. ابدأ بعقد المكتب الهندسي أو مقاول العظم.</div>'}`}
function documents(){return `<div class="section" style="margin-top:0"><h2>أرشيف الفواتير <span class="muted mini">(${data.docs.length})</span></h2></div><div class="notice">في هذا الإصدار تُرفق ملفات PDF الجاهزة فقط. تصوير الفاتورة وتحويلها إلى PDF داخل التطبيق قيد التطوير. تُضمَّن المرفقات في ملف المشروع عند التصدير.</div><div class="panel" style="margin-top:15px">${data.docs.length?data.docs.map(d=>`<div class="fileline"><div><b>▧ ${esc(d.name)}</b><div class="muted mini">${(d.size/1024).toFixed(0)} كيلوبايت · ${esc(d.ownerType==='expense'?'مصروف':'دفعة عقد')}</div></div><button class="btn tiny" onclick="viewDoc('${d.id}')">فتح PDF</button></div>`).join(''):'<div class="empty">لا توجد فواتير. أرفق PDF عند إضافة مصروف أو تسجيل دفعة.</div>'}</div>`}

function purchases(){let rows=[...data.purchases].sort((a,b)=>b.date.localeCompare(a.date));let total=sum(rows.map(x=>x.quantity*x.unitPrice));return `<div class="section" style="margin-top:0"><h2>سجل المشتريات <span class="muted mini">(${rows.length})</span></h2><button class="btn primary" onclick="purchaseModal()">+ إضافة مادة</button><button class="btn" onclick="exportPurchasesCSV()">تصدير CSV</button></div><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px"><div class="card"><div class="lbl">قيمة المواد المسجلة</div><div class="val">${money(total)}</div><div class="hint">مؤشر معلوماتي، لا يُضاف تلقائيًا إلى المصروفات</div></div><div class="card"><div class="lbl">عدد سجلات المشتريات</div><div class="val">${rows.length}</div></div></div><div class="panel"><p class="muted mini">لتجنب ازدواجية الحساب، سجّل مبلغ الشراء في «المصروفات» عند الدفع، واستخدم هذه الصفحة لتفاصيل الكمية وسعر الوحدة والمورد.</p><div class="tablewrap"><table class="tbl"><thead><tr><th>المادة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>المورد</th><th>المرحلة</th><th>الإجراء</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted mini">${datefmt(x.date)}</div></td><td>${moneyQty(x.quantity)} ${esc(x.measure)}</td><td>${money(x.unitPrice)}</td><td><b>${money(x.quantity*x.unitPrice)}</b></td><td>${esc(x.vendor)}</td><td>${esc(x.stage)}</td><td><button class="btn tiny" onclick="purchaseModal('${x.id}')">تعديل</button> <button class="btn tiny danger" onclick="deletePurchase('${x.id}')">حذف</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">لم تُسجل مشتريات بعد</td></tr>'}</tbody></table></div></div>`}
function moneyQty(n){return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:3}).format(num(n))}
function purchaseModal(id){let x=data.purchases.find(x=>x.id===id)||{name:'',quantity:1,unitPrice:'',measure:'حبة',vendor:'',date:today(),stage:STAGES[0],unit:UNITS[0],notes:''};modal(`<h2>${id?'تعديل شراء':'إضافة شراء / مادة'}</h2><form onsubmit="submitPurchase(event,'${id||''}')"><div class="formgrid">${field('اسم المادة *','name',x.name)}${field('الكمية *','quantity',x.quantity,'number','min="0.001" step="0.001" required')}${field('سعر الوحدة *','unitPrice',x.unitPrice,'number','min="0" step="0.01" required')}${field('وحدة القياس','measure',x.measure)}${field('المورد','vendor',x.vendor)}${field('تاريخ الشراء','date',x.date,'date')}<div class="field"><label>المرحلة</label><select name="stage">${opts(STAGES,x.stage)}</select></div><div class="field"><label>الوحدة / الدور</label><select name="unit">${opts(UNITS,x.unit)}</select></div><div class="field full"><label>ملاحظات</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><p class="notice">هذه بطاقة تفاصيل شراء، ولا تُسجّل دفعة مالية تلقائيًا. أضف المصروف في صفحة المصروفات لمنع التكرار.</p><div class="modalfoot"><button class="btn" type="button" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ</button></div></form>`)}
function submitPurchase(e,id){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));let q=Number(v.quantity),price=Number(v.unitPrice);if(!v.name.trim()||!Number.isFinite(q)||q<=0||!Number.isFinite(price)||price<0)return toast('تحقق من المادة والكمية والسعر');let x=data.purchases.find(x=>x.id===id);if(!x){x={id:uid()};data.purchases.push(x)}Object.assign(x,{name:v.name.trim(),quantity:q,unitPrice:price,measure:v.measure.trim(),vendor:v.vendor.trim(),date:v.date||today(),stage:v.stage,unit:v.unit,notes:v.notes});closeModal();mark();toast('تم حفظ المادة')}
function deletePurchase(id){if(!confirm('حذف سجل الشراء؟'))return;data.purchases=data.purchases.filter(x=>x.id!==id);mark()}
function stages(){let done=STAGES.filter(s=>data.stageProgress[s]?.status==='done').length;return `<div class="section" style="margin-top:0"><h2>متابعة مراحل البناء</h2><span class="pill ok">${done} / ${STAGES.length} مكتملة</span></div><div class="panel"><p class="muted mini">يمكنك تحديث حالة كل مرحلة، وتسجيل تاريخ الانتهاء وملاحظات التنفيذ. هذه متابعة إدارية وليست اعتمادًا هندسيًا.</p>${STAGES.map((s,i)=>{let p=data.stageProgress[s]||{};return `<div class="stageitem"><div style="flex:1;min-width:140px"><b>${i+1}. ${esc(s)}</b><div class="muted mini">${p.completedAt?'اكتملت: '+datefmt(p.completedAt):'—'}</div></div><select aria-label="حالة ${esc(s)}" onchange="updateStage(${i},this.value)"><option value="not_started" ${!p.status||p.status==='not_started'?'selected':''}>لم تبدأ</option><option value="active" ${p.status==='active'?'selected':''}>قيد التنفيذ</option><option value="done" ${p.status==='done'?'selected':''}>مكتملة</option></select><button class="btn tiny" onclick="stageNote(${i})">ملاحظات</button></div>`}).join('')}</div>`}
function updateStage(i,status){let s=STAGES[i],p=data.stageProgress[s]||{};p.status=status;p.completedAt=status==='done'?(p.completedAt||today()):'';data.stageProgress[s]=p;mark()}
function stageNote(i){let s=STAGES[i],p=data.stageProgress[s]||{};let n=prompt('ملاحظات المرحلة: '+s,p.notes||'');if(n===null)return;data.stageProgress[s]={...p,notes:n};mark();toast('تم حفظ الملاحظات')}

function reports(){let t=totals(),by=STAGES.map(s=>({s,v:sum(data.expenses.filter(x=>x.stage===s).map(x=>x.amount))+sum(data.contracts.filter(c=>c.stage===s).map(paid))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v),byUnit=UNITS.map(s=>({s,v:sum(data.expenses.filter(x=>x.unit===s).map(x=>x.amount))+sum(data.contracts.filter(c=>c.unit===s).map(paid))})).filter(x=>x.v>0);return `<div class="cards">${[['إجمالي المدفوع',t.spent],['المستحق حاليًا',t.due],['التزامات العقود',t.obligation],['المتبقي بعد الالتزامات',t.remaining]].map(x=>`<div class="card"><div class="lbl">${x[0]}</div><div class="val">${money(x[1])}</div></div>`).join('')}</div><div class="grid2" style="margin-top:16px"><div class="panel"><h3>المدفوع حسب مرحلة البناء</h3>${by.length?by.map(x=>`<div class="listrow"><span>${esc(x.s)}</span><b>${money(x.v)}</b></div>`).join(''):'<div class="empty">لا توجد بيانات</div>'}</div><div class="panel"><h3>المدفوع حسب الوحدة</h3>${byUnit.length?byUnit.map(x=>`<div class="listrow"><span>${esc(x.s)}</span><b>${money(x.v)}</b></div>`).join(''):'<div class="empty">لا توجد بيانات</div>'}</div></div><div class="actions" style="margin-top:16px"><button class="btn" onclick="exportCSV()">تصدير تقرير المصروفات CSV</button></div><p class="muted mini">دفعات العقود تُحسب ضمن المدفوع ولا تُضاف مرة أخرى إلى سجل المصروفات، لتجنب ازدواجية الحساب.</p>`}
function settings(){return `<div class="panel"><h3>بيانات المشروع</h3><div class="formgrid"><div class="field"><label>اسم المشروع</label><input id="projectname" value="${esc(data.name)}"></div><div class="field"><label>الميزانية المعتمدة (ريال)</label><input id="budget" type="number" min="0" step="0.01" value="${num(data.budget)}"></div></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="settingsSave()">حفظ الإعدادات</button></div></div><div class="section"><h2>النسخ الاحتياطية</h2></div><div class="panel"><p>الملف <b>.villa</b> يحتوي بيانات المشروع وفواتير PDF المرفقة. بعد تنزيله اختر حفظه في iCloud Drive أو «على الـ iPad» من تطبيق الملفات.</p><div class="notice">${esc(autoStatus||'التخزين المؤقت داخل المتصفح ليس نسخة احتياطية مضمونة.')} — آخر تعديل: ${new Date(data.modified).toLocaleString('ar-SA')}</div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveProject()">↧ حفظ في…</button><button class="btn" onclick="openProject()">↥ فتح مشروع…</button><button class="btn danger" onclick="newProject()">إنشاء مشروع جديد</button></div></div><div class="section"><h2>ضغط صور الإيصالات</h2></div><div class="panel"><div class="field"><label>الجودة الافتراضية للصور المصورة</label><select id="receiptQuality" onchange="setReceiptQuality(this.value)"><option value="small" ${data.receiptQuality==='small'?'selected':''}>توفير المساحة — 1200 بكسل</option><option value="balanced" ${data.receiptQuality==='balanced'?'selected':''}>متوازن — 1600 بكسل (موصى به)</option><option value="high" ${data.receiptQuality==='high'?'selected':''}>عالية — 2200 بكسل</option><option value="original" ${data.receiptQuality==='original'?'selected':''}>الأعلى — دون تصغير الأبعاد (مع تحويل PDF)</option></select></div><p class="muted mini">يُطبّق الضغط على الصور الجديدة فقط. يحتفظ البرنامج بملفات PDF الأصلية كما هي. راجع وضوح النص ورمز QR بعد التصوير.</p></div><div class="section"><h2>ملاحظات الإصدار</h2></div><div class="panel mini muted" style="line-height:2">الإصدار 2.0 تجريبي للاستخدام المبكر. يدعم المصروفات والعقود وجداول الدفعات والشروط والمرفقات PDF والحفظ والاستعادة. يدعم تصوير إيصال السداد وتحويله إلى PDF، لكنه لا يدعم قص حواف المستند تلقائيًا أو OCR أو الإشعارات. لا توجد مزامنة. جرّب الاستعادة من نسخة احتياطية قبل الاعتماد على بيانات حقيقية.</div>`}
function setReceiptQuality(v){data.receiptQuality=v;mark();toast('تم حفظ إعداد ضغط الصور')}
function settingsSave(){let b=Number($('#budget').value),name=$('#projectname').value.trim();if(!name||!Number.isFinite(b)||b<0)return toast('تحقق من اسم المشروع والميزانية');data.name=name;data.budget=b;mark();toast('تم حفظ الإعدادات')}
function modal(html){$('#modals').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('#modals').innerHTML='';draftFile=null}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function opts(arr,selected){return arr.map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('')}
function expenseModal(id){let x=data.expenses.find(x=>x.id===id)||{title:'',amount:'',vendor:'',date:today(),stage:STAGES[0],unit:UNITS[0],notes:'',docId:null};draftFile=null;modal(`<h2>${id?'تعديل مصروف':'إضافة مصروف جديد'}</h2><form id="expenseform" onsubmit="submitExpense(event,'${id||''}')"><div class="formgrid">${field('وصف المصروف *','title',x.title)}${field('المبلغ (ريال) *','amount',x.amount,'number','min="0.01" step="0.01" required')}${field('المورد / المستفيد','vendor',x.vendor)}${field('تاريخ الدفع','date',x.date,'date')}<div class="field"><label>مرحلة البناء</label><select name="stage">${opts(STAGES,x.stage)}</select></div><div class="field"><label>الدور / الوحدة</label><select name="unit">${opts(UNITS,x.unit)}</select></div><div class="field full"><label>ملاحظات</label><textarea name="notes">${esc(x.notes)}</textarea></div><div class="field full"><label>فاتورة PDF أو صورة ${x.docId?'(مرفقة سابقًا)':''}</label><input type="file" name="receipt" accept=".pdf,application/pdf,image/*"><small class="muted">تُحوّل الصور إلى PDF مضغوط تلقائيًا. PDF الأصلي يُحفظ كما هو، حتى 8 ميجابايت.</small></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ المصروف</button></div></form>`)}
async function pdfFromInput(input){let f=input?.files?.[0];if(!f)return null;if(f.size>8*1024*1024)throw Error('الحد الأقصى للفاتورة 8 ميجابايت');if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))throw Error('يُسمح بملفات PDF فقط');let url=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('تعذر قراءة PDF'));r.readAsDataURL(f)});if(!String(url).startsWith('data:application/pdf;base64,')){if(!String(url).includes('base64,'))throw Error('ملف غير صالح')}return {id:uid(),name:f.name,size:f.size,base64:url}}
async function documentFromInput(input){let f=input?.files?.[0];if(!f)return null;if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'))return pdfFromInput(input);if(f.type.startsWith('image/'))return imageToPdf(f);throw Error('صيغة المرفق غير مدعومة')}
async function submitExpense(e,id){e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f)),amount=Number(v.amount);if(!v.title.trim()||!Number.isFinite(amount)||amount<=0)return toast('الوصف والمبلغ الصحيح مطلوبان');try{let doc=await documentFromInput(f.elements.receipt),x=data.expenses.find(x=>x.id===id);if(!x){x={id:uid(),docId:null};data.expenses.push(x)}Object.assign(x,{title:v.title.trim(),amount,vendor:v.vendor.trim(),date:v.date||today(),stage:v.stage,unit:v.unit,notes:v.notes});if(doc){doc.ownerType='expense';doc.ownerId=x.id;data.docs.push(doc);x.docId=doc.id}closeModal();mark();toast('تم حفظ المصروف')}catch(err){toast(err.message)}}
function deleteExpense(id){if(!confirm('حذف هذا المصروف؟'))return;data.expenses=data.expenses.filter(x=>x.id!==id);data.docs=data.docs.filter(d=>!(d.ownerType==='expense'&&d.ownerId===id));mark()}
let editContractId=null;
function contractModal(id){let c=data.contracts.find(c=>c.id===id)||{title:'',party:'',value:'',stage:STAGES[0],unit:UNITS[0],notes:'',installments:[]};editContractId=id||null;modal(`<h2>${id?'تعديل العقد':'إضافة عقد جديد'}</h2><form id="contractform" onsubmit="submitContract(event)"><div class="formgrid">${field('اسم العقد *','title',c.title)}${field('المقاول / المكتب *','party',c.party)}${field('قيمة العقد (ريال) *','value',c.value,'number','min="0.01" step="0.01" required')}<div class="field"><label>مرحلة البناء</label><select name="stage">${opts(STAGES,c.stage)}</select></div><div class="field"><label>الوحدة</label><select name="unit">${opts(UNITS,c.unit)}</select></div><div class="field"><label>طريقة السداد</label><select id="paymode" onchange="changePayMode()"><option value="multiple">دفعات متعددة</option><option value="single" ${c.installments.length===1?'selected':''}>دفعة واحدة</option></select></div><div class="field full"><label>ملاحظات العقد</label><textarea name="notes">${esc(c.notes)}</textarea></div></div><div class="section"><h2>جدول الدفعات</h2><button type="button" class="btn tiny" id="addinst" onclick="addInstallment()">+ إضافة دفعة</button></div><div id="instlist"></div><p class="muted mini">يجب أن يساوي مجموع الدفعات قيمة العقد. يمكن تعديل الجدول قبل تسجيل أي سداد، وبعد السداد يمكن تعديل الشروط والمبالغ دون أن تقل عن المدفوع.</p><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary">حفظ العقد والدفعات</button></div></form>`);if(c.installments.length)c.installments.forEach(i=>addInstallment(i));else addInstallment();changePayMode()}
function addInstallment(i){let n=$$('#instlist .installment').length+1,id=i?.id||uid(),basis=i?.basis||'condition';let el=document.createElement('div');el.className='installment';el.dataset.id=id;el.innerHTML=`<div class="installmenthead"><b>الدفعة ${n}</b><button type="button" class="btn tiny danger" onclick="removeInstallment(this)">حذف</button></div><div class="formgrid">${field('اسم الدفعة','label',i?.label||'الدفعة '+n)}${field('المبلغ (ريال)','amount',i?.amount||'','number','min="0.01" step="0.01" required')}<div class="field"><label>أساس الاستحقاق</label><select name="basis" onchange="updateBasis(this)"><option value="condition" ${basis==='condition'?'selected':''}>عند تحقق شرط</option><option value="date" ${basis==='date'?'selected':''}>بتاريخ محدد</option><option value="both" ${basis==='both'?'selected':''}>تاريخ وشرط معًا</option></select></div><div class="field due-date">${field('تاريخ الاستحقاق','dueDate',i?.dueDate||'','date')}</div><div class="field full condition">${field('شرط الاستحقاق','condition',i?.condition||'')}</div></div><input type="hidden" name="fulfilled" value="${i?.fulfilled?'1':'0'}">`;$('#instlist').appendChild(el);updateBasis(el.querySelector('[name=basis]'));changePayMode()}
function $$(s){return [...document.querySelectorAll(s)]}function updateBasis(el){let p=el.closest('.installment'),b=el.value;p.querySelector('.condition').classList.toggle('hide',b==='date');p.querySelector('.due-date').classList.toggle('hide',b==='condition')}
function removeInstallment(el){let p=el.closest('.installment'),old=editContractId&&data.contracts.find(c=>c.id===editContractId)?.installments.find(i=>i.id===p.dataset.id);if(old&&(old.payments||[]).length)return toast('لا يمكن حذف دفعة مسجلة السداد');if($$('#instlist .installment').length<=1)return toast('يجب وجود دفعة واحدة على الأقل');p.remove()}
